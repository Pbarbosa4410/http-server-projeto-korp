apiVersion: 1

providers:
  - name: "HTTP Server Projeto Korp"
    orgId: 1
    folder: "Projeto Korp"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true

    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false